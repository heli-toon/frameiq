name: frameiq
description: A visual photography coach app that helps users take better photos through professionally designed composition overlays.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+1
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  sensors_plus: ^5.0.1
  native_device_orientation: ^2.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  image_picker: ^1.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  go_router: ^14.2.0
  smooth_page_indicator: ^1.1.0
  flutter_lucide: ^1.11.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/overlays/
    - assets/scenes/
    - assets/environments/
    - assets/poses/
    - assets/onboarding/